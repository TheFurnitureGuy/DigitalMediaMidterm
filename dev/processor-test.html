<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processor test</title>
  <style>
    body { margin: 24px; background: #070b16; color: #e8edf7; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 20px; }
    h2 { margin-top: 40px; padding: 10px 14px; border-left: 4px solid #7ab3ff; background: #101a35; font-size: 18px; color: #fff; }
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    figure { margin: 0; width: 300px; }
    figure img { display: block; width: 300px; height: 300px; object-fit: contain; background: #060a14; }
    figure img.detail { object-fit: none; object-position: 50% 45%; margin-top: 6px; height: 160px; }
    figcaption { margin-top: 6px; color: #a9b4cc; font-size: 12px; }
    figcaption b { color: #e8edf7; }
    #log { color: #a9b4cc; }
  </style>
</head>
<body>
  <h1>Processor test</h1>
  <p>Runs assets/js/processor.js on the sample photos. Not part of the website.</p>
  <p id="log">Running…</p>
  <div id="results"></div>

  <script src="../assets/js/vendor/canvas-plus.js"></script>
  <script src="../assets/js/vendor/pixi.min.js"></script>
  <script src="../assets/js/vendor/pixi-filters.js"></script>
  <script src="../assets/js/processor.js"></script>
  <script>
    var PHOTOS = {
      sunset: '../assets/images/sample-sunset.webp',
      desert: '../assets/images/sample-desert.png'
    };
    var LEVELS = { 1: 'Low', 2: 'Medium', 3: 'High' };
    var PRESETS = PhotoProcessor.LOOK_PRESETS;

    // Each run: a group heading, a photo, and the settings passed to processImage.
    var RUNS = [];
    ['clean', 'colossus', 'silenthill', 'snakeeater'].forEach(function (name) {
      ['sunset', 'desert'].forEach(function (photo) {
        RUNS.push({ group: 'Preset: ' + name, photo: photo, resolution: 2, colors: 64, dither: 'ordered', look: PRESETS[name], lookName: name });
      });
    });
    [1, 2, 3].forEach(function (res) {
      RUNS.push({ group: 'Resolution sweep (Clean)', photo: 'desert', resolution: res, colors: 64, dither: 'ordered', look: PRESETS.clean, lookName: 'clean' });
    });
    ['off', 'diffusion', 'ordered'].forEach(function (d) {
      RUNS.push({ group: 'Dithering at 16 colors (Clean)', photo: 'sunset', resolution: 2, colors: 16, dither: d, look: PRESETS.clean, lookName: 'clean' });
    });

    function ms(n) { return Math.round(n) + ' ms'; }
    function kb(n) { return (n / 1024).toFixed(1) + ' KB'; }

    // Exposed so the Playwright script can read the numbers.
    window.testResults = [];

    async function run() {
      var out = document.getElementById('results');
      var originals = {};
      var resized = {};
      var row = null;
      var group = '';

      for (var name in PHOTOS) originals[name] = await PhotoProcessor.loadImage(PHOTOS[name]);

      for (var i = 0; i < RUNS.length; i++) {
        var r = RUNS[i];
        if (r.group !== group) {
          group = r.group;
          var h = document.createElement('h2');
          h.textContent = group;
          out.appendChild(h);
          row = document.createElement('div');
          row.className = 'row';
          out.appendChild(row);
        }
        var key = r.photo + r.resolution;
        if (!resized[key]) resized[key] = PhotoProcessor.resizeImage(originals[r.photo], r.resolution);
        var result = await PhotoProcessor.processImage(resized[key], r);
        window.testResults.push(Object.assign({}, r, { width: result.width, height: result.height, bytes: result.blob.size, used: result.palette.length, renderer: result.renderer, timings: result.timings }));

        var fig = document.createElement('figure');
        var img = document.createElement('img');
        img.src = URL.createObjectURL(result.blob);
        img.alt = r.photo + ' processed';
        var detail = document.createElement('img');
        detail.className = 'detail';
        detail.src = img.src;
        detail.alt = r.photo + ' detail at actual size';
        var cap = document.createElement('figcaption');
        cap.innerHTML = '<b>' + r.photo + ' · ' + r.lookName + ' · ' + LEVELS[r.resolution] + ' · ' + r.colors + ' colors · ' + r.dither + '</b><br>' +
          result.width + '×' + result.height + ', ' + result.palette.length + ' colors used, ' + kb(result.blob.size) + ', ' + result.renderer + '<br>' +
          'total ' + ms(result.timings.total) + ' (palette ' + ms(result.timings.quantize) + ')';
        fig.appendChild(img);
        fig.appendChild(detail);
        fig.appendChild(cap);
        row.appendChild(fig);
      }
      document.getElementById('log').textContent = 'Done.';
      window.testDone = true;
    }

    run().catch(function (err) {
      document.getElementById('log').textContent = 'Error: ' + err.message;
      window.testError = err.message;
      window.testDone = true;
    });
  </script>
</body>
</html>
